<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token Launch Radar — fitted implied value for pre-token protocols</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>Token Launch Radar</h1>
  <p class="subtitle">Which pre-token protocol's token would be worth the most — and what should a reader do to farm it before it launches?</p>
  <p class="source" id="source-line"></p>
</header>
<section id="kpi" aria-label="Key results"></section>
<nav id="tabs" aria-label="Sections">
  <button data-tab="board" class="active">Board</button>
  <button data-tab="live">Live tokens</button>
  <button data-tab="method">Methodology</button>
  <button data-tab="playbooks">Category playbooks</button>
  <button data-tab="census">Census</button>
  <button data-tab="note">Research note</button>
</nav>
<main>
  <section id="view-board">
    <div class="controls">
      <input id="filter-text" type="search" placeholder="Filter by name, slug or category…" aria-label="Filter board">
      <button data-scope="all" class="scope active">All</button>
      <button data-scope="Watchlist" class="scope">Watchlist</button>
      <button data-scope="Early" class="scope">Early finds</button>
      <span id="row-count"></span>
    </div>
    <table id="board-table">
      <thead><tr>
        <th data-sort="rank">#</th>
        <th data-sort="name">Protocol</th>
        <th data-sort="scope">Scope</th>
        <th data-sort="tvl_usd">TVL</th>
        <th data-sort="change_7d">7d</th>
        <th data-sort="odds">Token odds</th>
        <th data-sort="implied_value_usd">Implied value</th>
        <th>90% band</th>
        <th>Conformal 80%</th>
        <th data-sort="break_even_pct">Break-even</th>
        <th data-sort="verdict">Verdict</th>
      </tr></thead>
      <tbody id="board-body"></tbody>
    </table>
  </section>
  <section id="view-detail" hidden></section>
  <section id="view-live" hidden></section>
  <section id="view-method" hidden></section>
  <section id="view-playbooks" hidden></section>
  <section id="view-census" hidden></section>
  <section id="view-note" hidden></section>
</main>
<footer id="audit"></footer>
<script src="../data.js"></script>
<script src="recompute.js"></script>
<script src="app.js"></script>
</body>
</html>
