<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token Launch Radar — fitted value, token odds, farm plans</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>Token Launch Radar</h1>
  <p id="asof" class="dim"></p>
  <div id="kpis" class="kpis"></div>
  <div id="audit" class="audit"></div>
</header>
<nav>
  <button class="tab active" data-pane="pane-board">Board</button>
  <button class="tab" id="tab-detail" data-pane="pane-detail">Detail</button>
  <button class="tab" data-pane="pane-method">Methodology</button>
  <button class="tab" data-pane="pane-census">Census</button>
  <button class="tab" data-pane="pane-research">Research note</button>
</nav>
<section id="pane-board" class="pane active">
  <div class="controls">
    <input id="q" type="search" placeholder="Search name, slug or category">
    <label><input id="watchonly" type="checkbox"> Watchlist only</label>
    <select id="catfilter"></select>
    <span id="rowcount" class="dim"></span>
  </div>
  <table>
    <thead><tr>
      <th>#</th><th>Protocol</th><th>Category</th>
      <th data-sort="tvl" class="num">TVL ↕</th><th>7d</th>
      <th data-sort="odds" class="num">Odds ↕</th>
      <th data-sort="implied" class="num">Implied ↕</th><th class="num">Net expected</th>
    </tr></thead>
    <tbody id="board"></tbody>
  </table>
  <p class="dim">Click a row for its detail view. Implied value = 10^curve × token odds. Net expected = implied × odds − gas.</p>
</section>
<section id="pane-detail" class="pane"><div id="detail"><p class="dim">Click a board row to see its detail.</p></div></section>
<section id="pane-method" class="pane"><div id="method"></div></section>
<section id="pane-census" class="pane"><div id="census"></div></section>
<section id="pane-research" class="pane"><div id="research"></div></section>
<script src="../data.js"></script>
<script src="recompute.js"></script>
<script src="app.js"></script>
</body>
</html>
